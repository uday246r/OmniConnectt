# A release: immutable images and one frontend artifact, then a deploy that needs a human's approval.
#
#   git tag v2026.10.05 && git push origin v2026.10.05      (or run it by hand: "Run workflow")
#
# Required configuration (Settings → Secrets and variables → Actions, and Environments):
#   environment "production" with required reviewers   — the maker-checker gate on every deploy
#   secrets  DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
#   variable DEPLOY_PATH (where deploy/ lives on the server, e.g. /opt/omniconnect)
# Images go to GHCR under this repository; the server needs read access to it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      roll_forward_only:
        description: "Reason this release cannot be rolled back past (a destructive migration), or empty"
        required: false
        default: ""

permissions:
  contents: write     # attach the artifact to the GitHub Release
  packages: write     # push images to GHCR

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/omniconnect

jobs:
  images:
    name: Image — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: auth, dockerfile: AuthService/Dockerfile }
          - { image: lead, dockerfile: LeadService/Dockerfile }
          - { image: customer360, dockerfile: Customer360Service/Dockerfile }
          - { image: products, dockerfile: ProductsService/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged by commit: one tag, one build, forever — the release names exactly what it deploys.
      - uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  frontend:
    name: Frontend release artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    outputs:
      archive: ${{ steps.release.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history and tags: change detection diffs against the last release
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      # Rebuild only the apps that changed since the previous release; every other app's build is taken
      # byte-for-byte from that release's artifact. Builds are reproducible, so this is the same output a
      # full rebuild would give — faster, and it proves unchanged apps really are unchanged (an app whose
      # code changed without a version bump fails the build). No previous release → a full build.
      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$(git rev-parse HEAD)^" 2>/dev/null || true)"
          if [ -n "$prev" ] && gh release download "$prev" --pattern '*.tar.gz*' --dir ../prev-release 2>/dev/null; then
            echo "tag=$prev" >> "$GITHUB_OUTPUT"
            echo "archive=$(ls ../prev-release/*.tar.gz)" >> "$GITHUB_OUTPUT"
            echo "Incremental release since $prev"
          else
            echo "No previous release artifact found — building every app."
          fi
      - id: release
        env:
          CI: "true"
          ROLL_FORWARD_ONLY: ${{ inputs.roll_forward_only }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
          PREV_ARCHIVE: ${{ steps.previous.outputs.archive }}
        run: |
          args=()
          if [ -n "$PREV_TAG" ]; then args+=(--since "$PREV_TAG" --reuse "$PREV_ARCHIVE"); fi
          if [ -n "$ROLL_FORWARD_ONLY" ]; then args+=(--roll-forward-only "$ROLL_FORWARD_ONLY"); fi
          pnpm release -- "${args[@]}"
          echo "archive=$(basename "$(ls release/*.tar.gz)")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: |
            Frontend/release/*.tar.gz
            Frontend/release/*.tar.gz.sha256
      # Immutable record of what was released.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Frontend/release/*.tar.gz
            Frontend/release/*.tar.gz.sha256

  deploy:
    name: Deploy to production
    needs: [images, frontend]
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the human approval before anything goes live.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: release
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship deploy/ and the release
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # The server keeps its own .env and env/*.env (secrets); everything else comes from the repo.
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            --exclude '.env' --exclude 'env/*.env' --exclude 'certs/' \
            deploy/ "$TARGET:$DEPLOY_PATH/deploy/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy" release/ "$TARGET:$DEPLOY_PATH/releases-incoming/"
      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          ARCHIVE: ${{ needs.frontend.outputs.archive }}
          SHA: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          RUN: ${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH/deploy"
          # Point every service at this commit's images.
          sed -i -E "s|^IMAGE_REGISTRY=.*|IMAGE_REGISTRY=$REGISTRY|; s|^(AUTH|LEAD|C360|PRODUCTS)_TAG=.*|\1_TAG=$SHA|" .env
          GITHUB_RUN_ID=$RUN scripts/deploy.sh "$DEPLOY_PATH/releases-incoming/$ARCHIVE"
          EOF
