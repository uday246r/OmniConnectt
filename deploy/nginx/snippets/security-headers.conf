# Browser hardening for every response. NOTE: in nginx a location that declares any add_header drops
# ALL headers inherited from the server block, so every such location includes this file again.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Content Security Policy — REPORT-ONLY until a release has run clean against it in production; then
# change the header name to Content-Security-Policy. Allowed beyond 'self': Google Fonts (index.html)
# and Google Identity Services (the "Sign in with Google" button). Everything else — every remote, every
# API — is same-origin by design, which is what makes a policy this tight possible.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
