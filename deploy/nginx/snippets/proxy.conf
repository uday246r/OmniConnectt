# Plain HTTP API traffic to a backend over a keep-alive upstream.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# OVERWRITE, never append ($proxy_add_x_forwarded_for): the backends believe X-Forwarded-For from this
# proxy (ForwardedHeaders:KnownNetworks), so a client-supplied value must not survive the hop, or the
# login rate limiter and every audit row could be told any IP the caller likes. If a cloud load
# balancer sits in front of this nginx, configure set_real_ip_from for it and this stays correct.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# A backend's error body is the platform's own JSON; pass it through untouched.
proxy_intercept_errors off;
