# A versioned build folder never changes, so its files are cacheable forever. Included in a location
# that sets headers, which in nginx replaces every add_header inherited from the server — hence the
# security headers are repeated here, not merely inherited.
include /etc/nginx/snippets/security-headers.conf;
add_header Cache-Control "public, max-age=31536000, immutable" always;
access_log off;
