# SignalR: negotiate over HTTP, then a long-lived WebSocket (or SSE / long-polling fallback).
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# Longer than SignalR's keep-alive interval (15s) and client timeout (30s), so an idle but healthy
# connection is never cut by the proxy.
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# Server-sent events and long-polling must not sit in a buffer.
proxy_buffering off;
