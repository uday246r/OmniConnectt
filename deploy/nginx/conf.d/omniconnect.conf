# OmniConnect — the platform's only public entry point.
#
#   /                               → the live host's index.html        (no-cache)
#   /host/<version>/…               → host build files                   (immutable)
#   /modules/<key>/<version>/…      → remote builds                      (immutable)
#   /api/lead-service/…             → LeadService
#   /api/customer360-service/…      → Customer360Service
#   /api/products-service/…         → ProductsService (incl. its SignalR hub)
#   /api/…, /hubs/…                 → AuthService
#
# Every build lives in its own versioned folder and is never overwritten, so a release only ADDS files
# and then moves a pointer (/srv/omniconnect/current, and each remote's registered manifest URL). The
# host and every remote not in a release keep serving exactly what they served — and a tab that already
# loaded an old build keeps finding its chunks. See docs/RUNBOOK-RELEASE.md.
#
# Order of location matching (nginx, not first-match): exact (=) → longest prefix → regex in file order,
# where a matching regex beats the prefix unless that prefix is marked ^~. The deny rule for internal
# routes below is a regex for exactly that reason — it must win over /api/<service>/.

# ── Shared definitions ──────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The path without its query string. SignalR sends the access token as ?access_token=…; logging
# $request would write every user's JWT into the access log.
log_format omniconnect '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_referer" "$http_user_agent"';

upstream omni_auth     { server auth:8080;     keepalive 16; }
upstream omni_lead     { server lead:8080;     keepalive 16; }
upstream omni_c360     { server c360:8080;     keepalive 16; }
upstream omni_products { server products:8080; keepalive 16; }

# ── Public server ───────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /srv/omniconnect;
    access_log /dev/stdout omniconnect;

    # Who the client is and which scheme it used: this nginx itself (EDGE_PROXY=none), or a TLS proxy
    # on the same machine in front of it (EDGE_PROXY=local-proxy). Mounted by compose.yml.
    include /etc/nginx/edge/edge.conf;

    # Product documents and imports; anything larger is refused here rather than by a backend.
    client_max_body_size 20m;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness of the edge itself, for the load balancer / compose healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # What is live, for operators: "which Lead version is running in production?"
    location = /release-manifest.json {
        alias /srv/omniconnect/current/release-manifest.json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Service-to-service routes are never reachable from outside, whatever prefix they arrive under:
    # approval replay, the catalogue lookup, capability discovery, and API explorers.
    location ~ ^/api/[^/]+-service/(internal|permissions|swagger)(/|$) {
        return 404;
    }

    # ── Backends ──

    location /api/lead-service/ {
        proxy_pass http://omni_lead;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/customer360-service/ {
        proxy_pass http://omni_c360;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/products-service/hubs/ {
        proxy_pass http://omni_products;
        include /etc/nginx/snippets/websocket.conf;
    }

    location /api/products-service/ {
        proxy_pass http://omni_products;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /hubs/ {
        proxy_pass http://omni_auth;
        include /etc/nginx/snippets/websocket.conf;
    }

    # AuthService is published at the origin root's /api: its refresh cookie is scoped to /api/auth.
    location /api/ {
        proxy_pass http://omni_auth;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ── Frontend builds ──

    # Content-addressed by folder: a version is never rewritten, so browsers may keep it forever.
    # =404 rather than the SPA fallback: a missing chunk must fail as a missing chunk, not arrive as
    # index.html with a 200 and break as "Failed to load module script".
    location /host/ {
        try_files $uri =404;
        include /etc/nginx/snippets/immutable.conf;
    }

    location /modules/ {
        # A remote is a module, not a page: refuse anything but its build files.
        location ~ /index\.html$ { return 404; }
        try_files $uri =404;
        include /etc/nginx/snippets/immutable.conf;
    }

    # Every other path is a client-side route of the host: serve the live index.html.
    location / {
        try_files /current/index.html =503;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}

# ── Internal listener ───────────────────────────────────────────────────────
#
# Reachable only on the compose network (as web-internal:8081), never published. AuthService fetches
# remote manifests through it — to probe health and to check a build before it is promoted — so it
# reads exactly the files browsers will get.

server {
    listen 8081;
    server_name web-internal;
    server_tokens off;
    root /srv/omniconnect;
    access_log off;

    location /modules/ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
