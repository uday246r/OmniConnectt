# Edge mode "local-proxy": a TLS proxy on the same machine is the public edge — on Windows Server,
# Caddy terminates HTTPS and forwards to this nginx through WSL's localhost forwarding. Every
# connection then arrives from the docker network's gateway, so the user's real address must be taken
# from the X-Forwarded-For header that proxy sets (Caddy ignores any value a client sends and writes
# the address it actually saw). Without this, every user would share one login rate-limit bucket and
# every audit row would record the server's own address.
#
# SAFE ONLY while this nginx is published on 127.0.0.1 (PUBLIC_BIND=127.0.0.1 in deploy/.env), so the
# local proxy is the only thing that can reach it. Exposed on the network, anyone could claim any IP.
#
# The range is the compose network (PROXY_SUBNET); change both together. Loopback too: depending on the
# engine, a connection from the host's loopback reaches nginx from the network's gateway (Docker's
# userland proxy) or from 127.0.0.1 (Podman's port forwarding) - either way it can only be the local proxy.
set_real_ip_from 172.30.0.0/24;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# The browser spoke HTTPS to the proxy; the hop to nginx is plain HTTP on loopback.
set $forwarded_proto $http_x_forwarded_proto;
